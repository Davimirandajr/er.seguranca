<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo ER Portaria e Segurança</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f7ff;
      color: #0f172a;
      overflow-x: hidden;
    }
    .bg-control-room {
      background-image: linear-gradient(to bottom, rgba(240, 247, 255, 0.85), rgba(224, 242, 254, 0.95)),
                        url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(14, 165, 233, 0.25);
      box-shadow: 0 20px 40px -15px rgba(14, 165, 233, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.9);
    }
    .btn-neon {
      background: linear-gradient(135deg, #0284c7 0%, #1d4ed8 100%);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-neon:hover {
      box-shadow: 0 12px 28px rgba(2, 132, 199, 0.5);
      transform: translateY(-2px);
    }
    .input-field {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      transition: all 0.2s ease;
    }
    .input-field:focus-within {
      border-color: #0284c7;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }
    .blend-multiply {
      mix-blend-mode: multiply;
    }
    .tech-grid {
      background-size: 32px 32px;
      background-image: linear-gradient(to right, rgba(14, 165, 233, 0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(14, 165, 233, 0.05) 1px, transparent 1px);
    }
  </style>
</head>
<body class="min-h-screen bg-control-room tech-grid flex items-center justify-center p-4 sm:p-6 relative select-none">

  <!-- Glows suaves de fundo -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-400/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-red-400/15 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center z-10 py-6">
    
    <!-- LADO ESQUERDO: Branding sem a caixa branca quadrada -->
    <div class="lg:col-span-7 flex flex-col items-center justify-center text-center p-4 space-y-6">
      
      <!-- Logo limpa (com blend-multiply para mesclar fundo branco da imagem se for JPG/PNG) -->
      <div class="relative flex items-center justify-center w-full max-w-md py-4">
        <img src="image/logo.png" alt="Grupo ER Logo" class="w-full h-auto max-h-52 object-contain blend-multiply drop-shadow-md"/>
      </div>

      <div class="space-y-2">
        <h1 class="text-4xl sm:text-5xl font-black tracking-tight text-blue-700 uppercase drop-shadow-sm">
          GRUPO ER
        </h1>
        <h2 class="text-2xl sm:text-3xl font-extrabold tracking-wider text-red-600 uppercase drop-shadow-sm">
          PORTARIA E VIGILÂNCIA LTDA
        </h2>
      </div>

      <div class="inline-flex items-center space-x-2.5 bg-white/80 border border-blue-200 shadow-sm px-5 py-2 rounded-full text-xs text-blue-800 font-bold tracking-wide uppercase backdrop-blur-md">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Segurança 24 Horas!</span>
      </div>
    </div>

    <!-- LADO DIREITO: Card de Login mais elegante -->
    <div class="lg:col-span-5 flex justify-center">
      <div class="glass-panel w-full max-w-md rounded-3xl p-8 sm:p-10 relative overflow-hidden">
        
        <div class="mb-8 text-center sm:text-left">
          <h3 class="text-2xl font-black text-slate-800 tracking-tight">Acesso ao Portal</h3>
          <p class="text-xs text-slate-500 font-medium mt-1">Entre com as suas credenciais corporativas</p>
        </div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-5">
          
          <div class="space-y-1.5">
            <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider">E-mail Corporativo</label>
            <div class="input-field rounded-2xl flex items-center px-4 py-3.5">
              <i class="fa-regular fa-envelope text-blue-600 mr-3 text-sm"></i>
              <input type="email" id="email" required placeholder="ex: admin@erseguranca.com" class="w-full bg-transparent text-sm text-slate-900 placeholder-slate-400 font-medium focus:outline-none"/>
            </div>
          </div>

          <div class="space-y-1.5">
            <label class="block text-[11px] font-bold text-slate-700 uppercase tracking-wider">Senha</label>
            <div class="input-field rounded-2xl flex items-center px-4 py-3.5">
              <i class="fa-solid fa-lock text-blue-600 mr-3 text-sm"></i>
              <input type="password" id="password" required placeholder="••••••••••••" class="w-full bg-transparent text-sm text-slate-900 placeholder-slate-400 font-medium focus:outline-none"/>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-neon w-full py-4 px-6 rounded-2xl font-bold text-white flex items-center justify-center space-x-3 mt-6 text-sm tracking-wide">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>ENTRAR NO SISTEMA</span>
          </button>

        </form>

        <div id="toast" class="hidden absolute top-4 left-4 right-4 bg-slate-900 border border-cyan-500 text-cyan-200 text-xs py-3 px-4 rounded-xl shadow-2xl flex items-center justify-between z-20">
          <span id="toastMessage">Processando...</span>
        </div>

      </div>
    </div>

  </div>



  <div class="floor-reflection"></div>
<!-- FIREBASE AUTH SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBkIE0buv-9l-MTlh6m4H_uBd_l4UJChfI",
      authDomain: "er-seguranca.firebaseapp.com",
      projectId: "er-seguranca",
      storageBucket: "er-seguranca.firebasestorage.app",
      messagingSenderId: "815498700835",
      appId: "1:815498700835:web:babba252080a4c192de996"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleAuthSubmit = async function(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      showToast("Autenticando via Firebase...");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        
        // CORRIGIDO: Salva exatamente a mesma chave que os portais exigem
        localStorage.setItem("er_usuario_logado", email);

        showToast("Login autorizado! Redirecionando...");

        // Redirecionamento baseado nos cargos (Chefia vs Gestão)
        setTimeout(() => {
          const executiveKeywords = ['admin', 'chefe', 'dono', 'patrao', 'patrão', 'proprietario', 'diretor', 'ceo'];
          const isExecutive = executiveKeywords.some(keyword => email.includes(keyword));

          if (isExecutive) {
            window.location.href = 'portalchefia.html';
          } else {
            window.location.href = 'portalgestao.html';
          }
        }, 1000);

      } catch (error) {
        let msg = error.message;
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          msg = "E-mail ou senha incorretos.";
        }
        showToast("Erro: " + msg);
      }
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      if (toast && toastMsg) {
        toastMsg.textContent = message;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 4000);
      }
    }
  </script>
</body>
</html>

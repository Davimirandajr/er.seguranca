<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ER Segurança e Vigilância LTDA - Portal de Acesso</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      overflow-x: hidden;
    }
    .bg-control-room {
      background-image: linear-gradient(to bottom, rgba(3, 7, 18, 0.65), rgba(3, 7, 18, 0.85)),
                        url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .btn-neon {
      background: linear-gradient(135deg, #ef4444 0%, #3b82f6 100%);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.5), 0 0 25px rgba(59, 130, 246, 0.4);
      transition: all 0.3s ease;
    }
    .btn-neon:hover {
      box-shadow: 0 0 22px rgba(239, 68, 68, 0.8), 0 0 35px rgba(59, 130, 246, 0.7);
      transform: translateY(-1px);
    }
    .input-field {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }
    .input-field:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
      background: rgba(15, 23, 42, 0.8);
    }
    .floor-reflection {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 120px;
      background: linear-gradient(to top, rgba(3, 7, 18, 0.95), transparent);
      pointer-events: none;
    }
    .tech-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
  </style>
</head>
<body class="min-h-screen bg-control-room tech-grid flex items-center justify-center p-4 relative select-none">

  <!-- Ambient Light Effects -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-center z-10 py-8">
    
    <!-- LEFT SECTION: Branding -->
    <div class="lg:col-span-7 flex flex-col items-center justify-center text-center p-6 space-y-6">
      <div class="relative flex items-center justify-center mb-2">
        <svg class="w-48 h-48 md:w-64 md:h-64" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="blueNeon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#60a5fa" /><stop offset="100%" stop-color="#1d4ed8" />
            </linearGradient>
            <linearGradient id="redNeon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f87171" /><stop offset="100%" stop-color="#dc2626" />
            </linearGradient>
          </defs>
          <path d="M 130 45 L 75 45 C 55 45 40 60 40 80 C 40 90 50 100 70 100 L 120 100 L 70 100 C 50 100 40 110 40 120 C 40 140 55 155 75 155 L 130 155" stroke="url(#blueNeon)" stroke-width="18" stroke-linecap="round" fill="none"/>
          <path d="M 155 45 L 210 45 C 245 45 260 65 260 85 C 260 105 245 118 210 118 L 155 118 M 200 118 L 255 155" stroke="url(#redNeon)" stroke-width="18" stroke-linecap="round" fill="none"/>
        </svg>
      </div>

      <div class="space-y-1">
        <h1 class="text-3xl md:text-5xl font-black tracking-wider text-white uppercase drop-shadow-md">ER SEGURANÇA</h1>
        <h2 class="text-2xl md:text-4xl font-extrabold tracking-widest text-gray-100 uppercase drop-shadow-md">E VIGILÂNCIA LTDA</h2>
      </div>

      <div class="inline-flex items-center space-x-2 bg-slate-900/60 border border-slate-700/50 px-4 py-1.5 rounded-full text-xs text-cyan-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="tracking-wider uppercase font-medium">Segurança 24 horas!</span>
      </div>
    </div>

    <!-- RIGHT SECTION: Login / Cadastro Card -->
    <div class="lg:col-span-5 flex justify-center">
      <div class="glass-panel w-full max-w-md rounded-2xl p-8 sm:p-10 relative overflow-hidden">
        
        <div class="mb-6 flex items-center justify-between">
          <div>
            <h3 id="form-title" class="text-2xl font-bold text-white tracking-tight">Acesso ao Portal</h3>
            <p id="form-subtitle" class="text-xs text-cyan-300/80">Entre com sua conta corporativa</p>
          </div>
          <button type="button" onclick="toggleAuthMode()" class="text-xs text-blue-400 hover:text-blue-300 underline font-semibold">
            <span id="toggle-mode-text">Criar Conta</span>
          </button>
        </div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
          
          <div class="space-y-1">
            <label class="block text-[11px] font-medium text-gray-300 uppercase tracking-wider">E-mail Corporativo</label>
            <div class="input-field rounded-xl flex items-center px-4 py-3">
              <i class="fa-regular fa-envelope text-gray-400 mr-3 text-sm"></i>
              <input type="email" id="email" required placeholder="ex: admin@erseguranca.com" class="w-full bg-transparent text-sm text-white placeholder-gray-500 focus:outline-none"/>
            </div>
          </div>

          <div class="space-y-1">
            <label class="block text-[11px] font-medium text-gray-300 uppercase tracking-wider">Senha</label>
            <div class="input-field rounded-xl flex items-center px-4 py-3">
              <i class="fa-solid fa-lock text-gray-400 mr-3 text-sm"></i>
              <input type="password" id="password" required placeholder="••••••••••••" class="w-full bg-transparent text-sm text-white placeholder-gray-500 focus:outline-none"/>
            </div>
          </div>

          <div id="access-key-container" class="space-y-1 hidden">
            <label class="block text-[11px] font-medium text-amber-400 uppercase tracking-wider">Chave de Acesso / Master Key</label>
            <div class="input-field rounded-xl flex items-center px-4 py-3 border-amber-500/50">
              <i class="fa-solid fa-key text-amber-400 mr-3 text-sm"></i>
              <input type="password" id="access-key" placeholder="Insira a chave de segurança" class="w-full bg-transparent text-sm text-white placeholder-gray-500 focus:outline-none"/>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-neon w-full py-3.5 px-6 rounded-xl font-semibold text-white flex items-center justify-center space-x-3 mt-4">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span id="submit-btn-text" class="text-base">Entrar no Sistema</span>
          </button>

        </form>

        <div id="toast" class="hidden absolute top-4 left-4 right-4 bg-slate-900/95 border border-cyan-500 text-cyan-200 text-xs py-3 px-4 rounded-xl shadow-2xl flex items-center justify-between z-20 backdrop-blur-md">
          <span id="toastMessage">Processando...</span>
        </div>

      </div>
    </div>

  </div>

  <div class="floor-reflection"></div>

  <!-- Firebase v10 SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBkIE0buv-9l-MTlh6m4H_uBd_l4UJChfI",
      authDomain: "er-seguranca.firebaseapp.com",
      projectId: "er-seguranca",
      storageBucket: "er-seguranca.firebasestorage.app",
      messagingSenderId: "815498700835",
      appId: "1:815498700835:web:babba252080a4c192de996"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isRegisterMode = false;

    window.toggleAuthMode = function() {
      isRegisterMode = !isRegisterMode;
      const title = document.getElementById('form-title');
      const subtitle = document.getElementById('form-subtitle');
      const btnText = document.getElementById('submit-btn-text');
      const toggleText = document.getElementById('toggle-mode-text');
      const keyContainer = document.getElementById('access-key-container');

      if (isRegisterMode) {
        title.textContent = "Cadastro de Credencial";
        subtitle.textContent = "Insira sua chave de acesso para registrar";
        btnText.textContent = "Cadastrar Conta";
        toggleText.textContent = "Já tenho uma conta";
        keyContainer.classList.remove('hidden');
      } else {
        title.textContent = "Acesso ao Portal";
        subtitle.textContent = "Entre com sua conta corporativa";
        btnText.textContent = "Entrar no Sistema";
        toggleText.textContent = "Criar Conta";
        keyContainer.classList.add('hidden');
      }
    };

    window.handleAuthSubmit = async function(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const accessKey = document.getElementById('access-key').value.trim();

      showToast(isRegisterMode ? "Cadastrando credenciais..." : "Autenticando via Firebase...");

      try {
        if (isRegisterMode) {
          const MASTER_SECRET_KEY = "ERSEG2026@SEC";
          if (accessKey !== MASTER_SECRET_KEY) {
            throw new Error("Chave de Acesso inválida ou incorreta!");
          }

          await createUserWithEmailAndPassword(auth, email, password);
          showToast("Conta criada com sucesso! Redirecionando...");
        } else {
          await signInWithEmailAndPassword(auth, email, password);
          showToast("Login autorizado! Redirecionando...");
        }

        // Redirecionamento baseado nos cargos solicitados (Chefia vs Gestão)
        setTimeout(() => {
          const executiveKeywords = ['admin', 'chefe', 'dono', 'patrao', 'patrão', 'proprietario', 'diretor', 'ceo'];
          const isExecutive = executiveKeywords.some(keyword => email.includes(keyword));

          if (isExecutive) {
            window.location.href = 'portalchefia.html';
          } else {
            window.location.href = 'portalgestao.html';
          }
        }, 1000);

      } catch (error) {
        let msg = error.message;
        if (error.code === 'auth/invalid-credential') msg = "E-mail ou senha incorretos.";
        if (error.code === 'auth/email-already-in-use') msg = "Este e-mail já está cadastrado.";
        showToast("Erro: " + msg);
      }
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }
  </script>
</body>
</html>

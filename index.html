<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo ER Portaria e Seguranca</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
 <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f7ff;
      color: #0f172a;
      overflow-x: hidden;
    }
    .bg-control-room {
      background-image: linear-gradient(to bottom, rgba(240, 247, 255, 0.75), rgba(224, 242, 254, 0.9)),
                        url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 10px 30px -5px rgba(14, 165, 233, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.8);
    }
    .btn-neon {
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4), 0 0 20px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }
    .btn-neon:hover {
      box-shadow: 0 6px 22px rgba(14, 165, 233, 0.6), 0 0 30px rgba(37, 99, 235, 0.5);
      transform: translateY(-2px);
    }
    .input-field {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #0f172a;
      transition: all 0.3s ease;
    }
    .input-field:focus-within {
      border-color: #0284c7;
      box-shadow: 0 0 14px rgba(2, 132, 199, 0.25);
      background: #ffffff;
    }
    .floor-reflection {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 120px;
      background: linear-gradient(to top, rgba(240, 247, 255, 0.95), transparent);
      pointer-events: none;
    }
    .tech-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(14, 165, 233, 0.08) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(14, 165, 233, 0.08) 1px, transparent 1px);
    }
  </style>
</head>
<body class="min-h-screen bg-control-room tech-grid flex items-center justify-center p-4 relative select-none">

  <!-- Ambient Light Effects -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-red-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-center z-10 py-8">
    
    <!-- LEFT SECTION: Branding -->
    <div class="lg:col-span-7 flex flex-col items-center justify-center text-center p-6 space-y-6">
      <div class="relative flex items-center justify-center mb-2">
        <svg class="w-48 h-48 md:w-64 md:h-64" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="blueNeon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#60a5fa" /><stop offset="100%" stop-color="#1d4ed8" />
            </linearGradient>
            <linearGradient id="redNeon" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f87171" /><stop offset="100%" stop-color="#dc2626" />
            </linearGradient>
          </defs>
          <path d="M 130 45 L 75 45 C 55 45 40 60 40 80 C 40 90 50 100 70 100 L 120 100 L 70 100 C 50 100 40 110 40 120 C 40 140 55 155 75 155 L 130 155" stroke="url(#blueNeon)" stroke-width="18" stroke-linecap="round" fill="none"/>
          <path d="M 155 45 L 210 45 C 245 45 260 65 260 85 C 260 105 245 118 210 118 L 155 118 M 200 118 L 255 155" stroke="url(#redNeon)" stroke-width="18" stroke-linecap="round" fill="none"/>
        </svg>
      </div>

      <div class="space-y-1">
        <h1 class="text-3xl md:text-5xl font-black tracking-wider text-white uppercase drop-shadow-md">GRUPO ER</h1>
        <h2 class="text-2xl md:text-4xl font-extrabold tracking-widest text-gray-100 uppercase drop-shadow-md">PORTARIA E VIGILÂNCIA LTDA</h2>
      </div>

      <div class="inline-flex items-center space-x-2 bg-slate-900/60 border border-slate-700/50 px-4 py-1.5 rounded-full text-xs text-cyan-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="tracking-wider uppercase font-medium">Segurança 24 horas!</span>
      </div>
    </div>

    <!-- RIGHT SECTION: Login Card (Sem abas de cadastro) -->
    <div class="lg:col-span-5 flex justify-center">
      <div class="glass-panel w-full max-w-md rounded-2xl p-8 sm:p-10 relative overflow-hidden">
        
        <div class="mb-6">
          <h3 class="text-2xl font-bold text-white tracking-tight">Acesso ao Portal</h3>
          <p class="text-xs text-cyan-300/80">Entre com sua conta corporativa</p>
        </div>

        <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
          
          <div class="space-y-1">
            <label class="block text-[11px] font-medium text-gray-300 uppercase tracking-wider">E-mail Corporativo</label>
            <div class="input-field rounded-xl flex items-center px-4 py-3">
              <i class="fa-regular fa-envelope text-gray-400 mr-3 text-sm"></i>
              <input type="email" id="email" required placeholder="ex: admin@erseguranca.com" class="w-full bg-transparent text-sm text-white placeholder-gray-500 focus:outline-none"/>
            </div>
          </div>

          <div class="space-y-1">
            <label class="block text-[11px] font-medium text-gray-300 uppercase tracking-wider">Senha</label>
            <div class="input-field rounded-xl flex items-center px-4 py-3">
              <i class="fa-solid fa-lock text-gray-400 mr-3 text-sm"></i>
              <input type="password" id="password" required placeholder="••••••••••••" class="w-full bg-transparent text-sm text-white placeholder-gray-500 focus:outline-none"/>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-neon w-full py-3.5 px-6 rounded-xl font-semibold text-white flex items-center justify-center space-x-3 mt-4">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span class="text-base">Entrar no Sistema</span>
          </button>

        </form>

        <div id="toast" class="hidden absolute top-4 left-4 right-4 bg-slate-900/95 border border-cyan-500 text-cyan-200 text-xs py-3 px-4 rounded-xl shadow-2xl flex items-center justify-between z-20 backdrop-blur-md">
          <span id="toastMessage">Processando...</span>
        </div>

      </div>
    </div>

  </div>

  <div class="floor-reflection"></div>

<!-- FIREBASE AUTH SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBkIE0buv-9l-MTlh6m4H_uBd_l4UJChfI",
      authDomain: "er-seguranca.firebaseapp.com",
      projectId: "er-seguranca",
      storageBucket: "er-seguranca.firebasestorage.app",
      messagingSenderId: "815498700835",
      appId: "1:815498700835:web:babba252080a4c192de996"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.handleAuthSubmit = async function(event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      showToast("Autenticando via Firebase...");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        
        // CORRIGIDO: Salva exatamente a mesma chave que os portais exigem
        localStorage.setItem("er_usuario_logado", email);

        showToast("Login autorizado! Redirecionando...");

        // Redirecionamento baseado nos cargos (Chefia vs Gestão)
        setTimeout(() => {
          const executiveKeywords = ['admin', 'chefe', 'dono', 'patrao', 'patrão', 'proprietario', 'diretor', 'ceo'];
          const isExecutive = executiveKeywords.some(keyword => email.includes(keyword));

          if (isExecutive) {
            window.location.href = 'portalchefia.html';
          } else {
            window.location.href = 'portalgestao.html';
          }
        }, 1000);

      } catch (error) {
        let msg = error.message;
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          msg = "E-mail ou senha incorretos.";
        }
        showToast("Erro: " + msg);
      }
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      if (toast && toastMsg) {
        toastMsg.textContent = message;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 4000);
      }
    }
  </script>
</body>
</html>
